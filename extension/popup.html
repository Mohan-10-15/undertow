<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Undertow</title>
<style>
  :root {
    --ink: #10151C;
    --surface: #171E28;
    --border: #2A3542;
    --text: #E8EDF2;
    --text-muted: #93A1B0;
    --safe: #4FC99B;
    --caution: #E0A93E;
    --high: #E2793D;
    --critical: #E0526A;
    --accent: #7C9CFF;
    --font-display: Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 360px;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { padding: 14px; }
  header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 10px; }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
  .logo::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--safe); margin-right: 0.5rem; vertical-align: middle;
  }
  .current-url {
    font-size: 0.78rem; color: var(--text-muted);
    word-break: break-all; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem 0.65rem; margin-bottom: 10px;
  }
  #loading { color: var(--text-muted); font-size: 0.85rem; padding: 0.5rem 0; }
  #loading[hidden] { display: none; }

  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .result-card[hidden] { display: none; }
  .result-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .score-number { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; }
  .risk-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 0.25rem 0.55rem; border-radius: 999px; }

  .gauge-track {
    position: relative; height: 6px; border-radius: 999px; margin: 0 0 10px;
    background: linear-gradient(to right, var(--safe) 0%, var(--safe) 15%, var(--caution) 15%, var(--caution) 35%, var(--high) 35%, var(--high) 60%, var(--critical) 60%, var(--critical) 100%);
  }
  .gauge-marker { position: absolute; top: -3px; width: 3px; height: 12px; background: var(--text); border-radius: 2px; transform: translateX(-50%); }

  .signal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .signal-item { border-left: 3px solid var(--border); padding: 0.05rem 0 0.05rem 0.6rem; }
  .signal-item .signal-name { font-weight: 600; font-size: 0.85rem; }
  .signal-item .signal-detail { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.1rem; }
  .clean-message { color: var(--text-muted); font-size: 0.82rem; }
  .clean-message strong { color: var(--safe); display: block; font-size: 0.9rem; margin-bottom: 0.2rem; }
  .result-error { color: var(--caution); font-size: 0.85rem; }

  .manual-check { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .manual-check summary { cursor: pointer; font-size: 0.78rem; color: var(--text-muted); list-style: none; }
  .manual-check summary::-webkit-details-marker { display: none; }
  .manual-check summary::before { content: '+ '; color: var(--accent); }
  .manual-check[open] summary::before { content: '\2212 '; }
  .manual-body { margin-top: 8px; display: flex; gap: 6px; }
  #manual-url {
    flex: 1; background: var(--ink); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 0.8rem; padding: 0.4rem 0.5rem;
  }
  #manual-scan-btn {
    font-weight: 600; font-size: 0.8rem; background: var(--accent); color: #0D1220;
    border: none; border-radius: 6px; padding: 0 0.7rem; cursor: pointer;
  }
  footer { margin-top: 10px; font-size: 0.7rem; color: #5D6B7A; }
</style>
</head>
<body>
  <div class="wrap">
    <header><span class="logo">Undertow</span></header>
    <div class="current-url" id="current-url">Reading current tab…</div>
    <p id="loading">Checking this page…</p>
    <div class="result-card" id="result-card" hidden aria-live="polite"></div>

    <details class="manual-check">
      <summary>Check a different link</summary>
      <div class="manual-body">
        <input type="text" id="manual-url" placeholder="paste a link" autocomplete="off" spellcheck="false">
        <button type="button" id="manual-scan-btn">Scan</button>
      </div>
    </details>

    <footer>Runs locally in this popup. Nothing is sent anywhere.</footer>
  </div>
  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
