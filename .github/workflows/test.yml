name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm test
      - name: Extension popup tests
        run: |
          cd extension
          npm install
          npm test
      - name: Validation smoke check (informational — depends on a third-party dataset repo staying up, so it can't gate the build)
        continue-on-error: true
        run: |
          cd validation
          bash download-data.sh
          node validate.js
